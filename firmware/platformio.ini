[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	br3ttb/PID@^1.2.1
	br3ttb/PID-AutoTune@^1.0.0
monitor_speed = 115200
; FIRMWARE_VERSION is injected by CI (git tag or nightly stamp).
; Falls back to "dev" for local builds — see include/version.h.
build_flags =
	-D FIRMWARE_VERSION=\"${sysenv.FIRMWARE_VERSION}\"


